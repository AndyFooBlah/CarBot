name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: type-check, lint, test
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (type-check, lint, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Cloud Functions: type-check and lint
  # ---------------------------------------------------------------------------
  functions:
    name: Cloud Functions (type-check, lint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts
