name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CarBot consumes @andyfooblah/voice-common and @andyfooblah/knowledge-common
# via `file:../voicecommon` and `file:../knowledgecommon` paths. In CI we
# check out the peer repos as siblings so those paths resolve. Both peer
# repos are public, so no token is needed — this also lets CI run on
# forked pull requests (a repo secret would be unavailable to forks).
jobs:
  # ---------------------------------------------------------------------------
  # Frontend: type-check, lint, test
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (type-check, lint, test)
    runs-on: ubuntu-latest

    steps:
      - name: Check out CarBot
        uses: actions/checkout@v4
        with:
          path: carbot

      - name: Check out VoiceCommon
        uses: actions/checkout@v4
        with:
          repository: andyfooblah/VoiceCommon
          path: voicecommon

      - name: Check out KnowledgeCommon
        uses: actions/checkout@v4
        with:
          repository: andyfooblah/KnowledgeCommon
          path: knowledgecommon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: carbot/package-lock.json

      - name: Build VoiceCommon lib
        working-directory: voicecommon
        run: |
          npm ci
          npm run build:lib

      - name: Build KnowledgeCommon lib
        working-directory: knowledgecommon
        run: |
          npm ci
          npm run build:lib

      - name: Install dependencies
        working-directory: carbot
        run: npm ci

      - name: Type-check
        working-directory: carbot
        run: npx tsc --noEmit

      - name: Lint
        working-directory: carbot
        run: npx eslint src --ext .ts,.tsx

      - name: Run tests
        working-directory: carbot
        run: npm test

  # ---------------------------------------------------------------------------
  # Cloud Functions: type-check and lint
  # ---------------------------------------------------------------------------
  functions:
    name: Cloud Functions (type-check, lint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: carbot/functions

    steps:
      - name: Check out CarBot
        uses: actions/checkout@v4
        with:
          path: carbot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: carbot/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
